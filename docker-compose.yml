services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-armeniareporta}
      POSTGRES_USER: ${POSTGRES_USER:-armenia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-armenia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-armenia} -d ${POSTGRES_DB:-armeniareporta}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-key-change-me}
      DEBUG: ${DEBUG:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      DATABASE_URL: postgres://${POSTGRES_USER:-armenia}:${POSTGRES_PASSWORD:-armenia}@db:5432/${POSTGRES_DB:-armeniareporta}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    command: sh -c "npm install && npx ng serve --host 0.0.0.0"

volumes:
  postgres_data:
