<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Confirmación de cuenta</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      @if (estado() === 'cargando') {
        <div class="estado">
          <mat-spinner diameter="40"></mat-spinner>
          <p>Confirmando tu cuenta…</p>
        </div>
      } @else if (estado() === 'exito') {
        <div class="estado exito">
          <mat-icon color="primary">check_circle</mat-icon>
          <p>{{ mensaje() }}</p>
        </div>
      } @else {
        <div class="estado error">
          <mat-icon color="warn">error</mat-icon>
          <p>{{ mensaje() }}</p>
        </div>
      }

      @if (estado() !== 'cargando') {
        <button
          mat-flat-button
          color="primary"
          class="w-full"
          (click)="irAlLogin()"
        >
          Ir al Login
        </button>
      }
    </mat-card-content>
  </mat-card>
</div>
